<button
  class="btn"
  (mousedown)="isPressed = true"
  (mouseup)="isPressed = false"
  (mouseleave)="isPressed = false"
  [class.is-active]="isPressed"
  (touchstart)="isPressed = true"
  (touchend)="isPressed = false"
>
  <label class="btn">{{ date$ | async | date: 'yyyy/MM/dd' }}</label>
</button>
