<button
  class="btn btn-bar-nso"
  (mousedown)="isPressed = false"
  (mouseup)="isPressed = true"
  (mouseleave)="isPressed = true"
  [class.is-active]="isPressed"
  (touchstart)="isPressed = false"
  (touchend)="isPressed = true"
>
  <app-icon-selector [name]="(icon$ | async) || 'noon'" [size]="26" />
  <label class="btn">{{ clock$ | async | date: 'HH:mm:ss' }}</label>
</button>
